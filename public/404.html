<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未寻得 — 山海神谕</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lost {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 24px;
    }
    .lost h1 {
      font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      font-size: 42px;
      letter-spacing: 0.2em;
      margin-bottom: 16px;
    }
    .lost p {
      color: #c4b9a2;
      letter-spacing: 0.08em;
      margin-bottom: 32px;
    }
    .lost a {
      display: inline-flex;
      padding: 12px 28px;
      border: 1px solid rgba(201, 162, 39, 0.45);
      border-radius: 999px;
      letter-spacing: 0.2em;
      color: #ede4d0;
    }
    .lost a:hover { border-color: #c23a2b; color: #fdf3e4; }
  </style>
</head>
<body>
  <div class="lost">
    <div>
      <h1>此境未载</h1>
      <p>山海浩渺，此处并无此页。</p>
      <a href="/">返回仙境</a>
    </div>
  </div>
</body>
</html>
